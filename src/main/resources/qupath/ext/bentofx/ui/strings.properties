name = BentoFX extension
description = This extension switches the QuPath GUI to one based on dock panels.

# Extensions > BentoFX extension menu
menu.initialise = Initialisation
menu.capture = Capture floating windows
menu.save-layout = Save layout
menu.restore-layout = Restore layout
menu.deactivate = Deactivate BentoFX
tooltip.capture = Capture floating windows into BentoFX\n(also brings torn-off panels and detached viewers back)

# Preferences
pref.enable-on-startup = Enable BentoFX when QuPath starts
pref.enable-on-startup.description = Initialise the BentoFX dock layout automatically at startup, as Extensions > BentoFX extension > Initialisation does. Takes effect the next time QuPath is started.
pref.restore-layout = Restore saved layout when BentoFX starts
pref.restore-layout.description = When BentoFX is initialised, put the panes back as they were when the layout was last saved (Extensions > BentoFX > Save layout). Panels of captured dialogs are only restored while those dialogs are open.
pref.manual-capture = Capture windows manually
pref.manual-capture.description = By default, dialogs are docked into BentoFX as soon as they open. Turn this on to dock them only on request, with a capture button on the toolbar (or Extensions > BentoFX > Capture floating windows).

# Errors
error = BentoFX extension error
error.bento-already-setup = BentoFX already integrated into QuPath
error.bento-not-setup = BentoFX not yet integrated into QuPath
error.startup-failed = BentoFX could not be initialised at startup (see the log)
error.layout-save-failed = The layout could not be saved. See the log for details.
error.layout-unreadable = The saved layout could not be read, so it was not restored.
error.layout-restore-failed = The layout could not be restored completely; the panels were put back in a default arrangement.

# Notifications
info.deactivated = BentoFX deactivated
info.windows-captured = All windows captured
info.no-capture = No window to capture
info.layout-saved = Layout saved.
info.layout-restored = Layout restored.
info.layout-restored-waiting = Layout restored. These dialogs will dock into their saved places when they are opened:
info.layout-none = There is no saved layout yet. Use Save layout first.
info.grid-not-implemented = Fixed grid layouts are not implemented in BentoFX. Use "Add row", "Add column", the + button or drag tabs to arrange viewers.
info.remove-not-implemented = Removing rows and columns is not implemented in BentoFX. Close a viewer pane, or drag its tab elsewhere.
info.reset-sizes-not-implemented = Resetting viewer sizes is not implemented in BentoFX. Drag the dividers to resize panes.
info.last-viewer = QuPath needs at least one viewer, so only the image was closed.
info.last-main-viewer = The main window keeps at least one viewer, so only the image was closed.
info.viewer-already-floating = This viewer is already detached.
info.viewer-already-docked = This viewer is already docked.
info.viewer-cannot-detach = This viewer cannot be moved to its own window.
info.cannot-minimise = This panel cannot be minimised here.

# Tabs
tab.position = Tab position
tab.position.top = Top
tab.position.left = Left
tab.position.bottom = Bottom
tab.position.right = Right
tab.minimise = Minimise panel
tab.restore = Restore panel
